name: Package compatibility
on:
  push:
    branches: [master]
    paths: ['src/**', 'homebridge-ui/**', 'index.js', 'package*.json', 'config.schema.json', 'test/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['src/**', 'homebridge-ui/**', 'index.js', 'package*.json', 'config.schema.json', 'test/**', '.github/workflows/test.yml']
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:hap
      - run: npm run test:ui-server
      - name: Load all runtime dependencies without starting accessories
        run: node -e "if (typeof require('./index.js') !== 'function') process.exit(1)"
      - name: Inspect publishable package
        run: npm pack --dry-run

  configuration-ui:
    name: UI · ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scenario: ['opening is read-only', 'delete garage and lock', 'all 15 types', 'theme follows Homebridge', 'failed save keeps edits', 'API reference']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - id: browser
        run: node --test --test-reporter=./test/ui-reporter.cjs --test-name-pattern="$UI_SCENARIO" test/ui.browser.cjs
        env:
          UI_SCENARIO: ${{ matrix.scenario }}
      - name: ${{ steps.browser.outputs.result || 'Browser result unavailable' }}
        if: always()
        run: echo 'See the browser test step for details and the artifact for screenshots.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configuration-ui-${{ strategy.job-index }}
          path: test/ui-artifacts/

