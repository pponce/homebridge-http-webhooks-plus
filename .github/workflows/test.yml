name: Package compatibility
on:
  push:
    branches: [master]
    paths: ['src/**', 'index.js', 'package*.json', 'config.schema.json', 'test/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['src/**', 'index.js', 'package*.json', 'config.schema.json', 'test/**', '.github/workflows/test.yml']
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Load all runtime dependencies without starting accessories
        run: node -e "if (typeof require('./index.js') !== 'function') process.exit(1)"
      - name: Inspect publishable package
        run: npm pack --dry-run
