name: Package compatibility
on:
  push:
    branches: [master]
    paths: ['src/**', 'homebridge-ui/**', 'index.js', 'package*.json', 'config.schema.json', 'test/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['src/**', 'homebridge-ui/**', 'index.js', 'package*.json', 'config.schema.json', 'test/**', '.github/workflows/test.yml']
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:hap
      - name: Load all runtime dependencies without starting accessories
        run: node -e "if (typeof require('./index.js') !== 'function') process.exit(1)"
      - name: Inspect publishable package
        run: npm pack --dry-run

  configuration-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          UI_SCREENSHOT_LOG: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configuration-ui-screenshots
          path: test/ui-artifacts/
